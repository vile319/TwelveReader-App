<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <!-- iOS PWA: standalone, no Safari chrome, edge-to-edge on notch devices -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TwelveReader" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <meta name="google-adsense-account" content="ca-pub-7907977784876827">
  <title>TwelveReader - AI-Powered Reading Assistant</title>

  <!-- NOTE: Tailwind comes from the Vite build (see styles.css), not the CDN —
    the CDN script was redundant, warned in production, and cost ~100KB on iOS
    cellular. Likewise the esm.sh importmap is removed: Vite bundles
    react/pdfjs-dist, and the pinned esm.sh pdfjs (4.4.168) conflicted with the
    installed 4.10.38. AdSense loads lazily via components for non-premium
    users instead of blocking first paint. -->

  <!-- Inter font for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="antialiased">
  <div id="root"></div>

  <!-- This loads and runs the main React application -->
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' });
      });
    }
  </script>
</body>

</html>
